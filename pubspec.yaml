name: house_edge_demo
description: "Demo Flutter minh hoa tai lieu: Toan hoc nha cai - vi sao nguoi choi luon thua."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.6.0
  firebase_messaging: ^16.4.1
  flutter_local_notifications: ^22.0.1
  http: ^1.2.0
  provider: ^6.1.5+1
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Icon launcher lay tu crest thuong hieu (sinh boi tool/generate_app_icon.dart).
# Sinh icon: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0B1026"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/flags/
    - assets/images/
    - assets/fonts/
    - assets/videos/
  fonts:
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
